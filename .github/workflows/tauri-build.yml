name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.0.6)'
        required: true
      signing_key:
        description: 'Tauri signing private key (base64)'
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & publish release
    runs-on: windows-latest
    outputs:
      tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci
        shell: bash

      - name: Resolve version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event.inputs.signing_key || secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: .
          tagName: ${{ github.event.inputs.tag_name || github.ref_name }}
          releaseName: ${{ github.event.inputs.tag_name || github.ref_name }}
          releaseBody: "Task Manager ${{ github.event.inputs.tag_name || github.ref_name }} - Windows x64 installer with auto-update"
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

  upload-to-cnb:
    name: Upload artifacts to CNB and mirror latest.json
    runs-on: ubuntu-latest
    needs: build-and-release
    if: ${{ always() && needs.build-and-release.result == 'success' }}
    env:
      CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
      CNB_API_ENDPOINT: https://api.cnb.cool
      CNB_REPO_SLUG: shiyishi-2026/surenwu
      GH_REPO: a136249692/renwu
    steps:
      - name: Download release assets from GitHub
        env:
          TAG: ${{ needs.build-and-release.outputs.tag_name }}
          VER: ${{ needs.build-and-release.outputs.version }}
        run: |
          set -euo pipefail
          BASE="https://github.com/${GH_REPO}/releases/download/${TAG}"
          for f in \
            "latest.json" \
            "TaskManager_${VER}_x64-setup.exe" \
            "TaskManager_${VER}_x64-setup.exe.sig" \
            "TaskManager_${VER}_x64_en-US.msi" \
            "TaskManager_${VER}_x64_en-US.msi.sig"; do
            echo "Downloading ${f}"
            curl -fSL --retry 3 -o "$f" "${BASE}/${f}"
            test -s "$f"
          done
        shell: bash

      - name: Create CNB tag + release (REST API)
        env:
          TAG: ${{ needs.build-and-release.outputs.tag_name }}
        run: |
          set -euo pipefail
          H1="Authorization: Bearer ${CNB_TOKEN}"
          H2="Accept: application/json"
          CT="Content-Type: application/json"
          API="${CNB_API_ENDPOINT}"
          REPO="${CNB_REPO_SLUG}"

          # 1. Ensure tag exists (idempotent). CNB requires the tag before a release can exist.
          code=$(curl -sS --http1.1 -X POST -H "$H1" -H "$H2" -H "$CT" \
            -o /tmp/tagresp -w "%{http_code}" \
            "${API}/${REPO}/-/git/tags" \
            -d "{\"name\":\"${TAG}\",\"target\":\"main\",\"message\":\"${TAG}\"}")
          echo "create tag ${TAG} -> HTTP ${code}"
          if [ "${code}" == "201" ]; then
            echo "tag created"
          elif [ "${code}" == "200" ] || [ "${code}" == "204" ]; then
            echo "tag already exists (OK)"
          else
            echo "unexpected: $(head -c 300 /tmp/tagresp)"; exit 1
          fi

          # 2. Ensure release exists for this tag (idempotent).
          code=$(curl -sS --http1.1 -X POST -H "$H1" -H "$H2" -H "$CT" \
            -o /tmp/rlresp -w "%{http_code}" \
            "${API}/${REPO}/-/releases" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"body\":\"Task Manager ${TAG}\",\"draft\":false,\"prerelease\":false,\"make_latest\":\"true\",\"target_commitish\":\"main\"}")
          echo "create release ${TAG} -> HTTP ${code}"
          if [ "${code}" == "201" ]; then
            echo "release created"
          elif [ "${code}" == "409" ] || [ "${code}" == "400" ]; then
            echo "release likely exists; will get by tag below."
          else
            echo "unexpected: $(head -c 300 /tmp/rlresp)"; exit 1
          fi

          # 3. Get release id from tag.
          rid=$(curl -sS --http1.1 -H "$H1" -H "$H2" \
            "${API}/${REPO}/-/releases/tags/${TAG}" | \
            python3 -c "import sys,json;print(json.load(sys.stdin).get('id',''))" 2>/dev/null || true)
          echo "release_id=${rid}"
          test -n "${rid}" || { echo "FAIL: cannot find CNB release for ${TAG}"; exit 1; }
          echo "CNB_RELEASE_ID=${rid}" >> "$GITHUB_ENV"
        shell: bash

      - name: Upload assets to CNB release (REST API)
        env:
          TAG: ${{ needs.build-and-release.outputs.tag_name }}
          VER: ${{ needs.build-and-release.outputs.version }}
        run: |
          set -euo pipefail
          H1="Authorization: Bearer ${CNB_TOKEN}"
          H2="Accept: application/json"
          CT="Content-Type: application/json"
          API="${CNB_API_ENDPOINT}"
          REPO="${CNB_REPO_SLUG}"
          RID="${CNB_RELEASE_ID}"

          upload_one() {
            local file="$1"
            local size sz
            sz=$(wc -c < "$file")
            echo "--- uploading ${file} (${sz} bytes) ---"
            local resp upload_url verify_url
            resp=$(curl -sS --http1.1 -X POST -H "$H1" -H "$H2" -H "$CT" \
              "${API}/${REPO}/-/releases/${RID}/asset-upload-url" \
              -d "{\"asset_name\":\"${file}\",\"size\":${sz},\"overwrite\":true}")
            upload_url=$(echo "$resp" | python3 -c "import sys,json;print(json.load(sys.stdin).get('upload_url',''))" 2>/dev/null || true)
            verify_url=$(echo "$resp" | python3 -c "import sys,json;print(json.load(sys.stdin).get('verify_url',''))" 2>/dev/null || true)
            test -n "${upload_url}" || { echo "FAIL: no upload_url from $(echo "$resp" | head -c 200)"; exit 1; }
            local ucode
            ucode=$(curl -sS --http1.1 -X PUT -T "$file" -o /tmp/up -w "%{http_code}" "$upload_url")
            [ "${ucode}" == "200" ] || { echo "FAIL: PUT ${file} HTTP ${ucode}"; exit 1; }
            local vcode
            vcode=$(curl -sS --http1.1 -X POST -H "$H1" -H "$H2" -o /tmp/up -w "%{http_code}" "$verify_url")
            [ "${vcode}" == "200" ] || [ "${vcode}" == "201" ] || { echo "FAIL: verify ${file} HTTP ${vcode}"; exit 1; }
            echo "OK: ${file}"
          }

          for f in \
            "latest.json" \
            "TaskManager_${VER}_x64-setup.exe" \
            "TaskManager_${VER}_x64-setup.exe.sig" \
            "TaskManager_${VER}_x64_en-US.msi" \
            "TaskManager_${VER}_x64_en-US.msi.sig"; do
            upload_one "$f"
          done
        shell: bash

      - name: Verify CNB uploads (anonymous, follows redirect)
        env:
          TAG: ${{ needs.build-and-release.outputs.tag_name }}
          VER: ${{ needs.build-and-release.outputs.version }}
        run: |
          set -euo pipefail
          CNB_BASE="https://cnb.cool/${CNB_REPO_SLUG}/-/releases/download/${TAG}"
          for f in \
            "latest.json" \
            "TaskManager_${VER}_x64-setup.exe" \
            "TaskManager_${VER}_x64-setup.exe.sig" \
            "TaskManager_${VER}_x64_en-US.msi" \
            "TaskManager_${VER}_x64_en-US.msi.sig"; do
            # NOTE: CNB returns 302 even when the underlying asset is missing (cache layer).
            # So we follow redirects (-L) and require a non-empty body / final 200.
            code=$(curl -sS --http1.1 -L -o /tmp/verify -w "%{http_code}" "${CNB_BASE}/${f}")
            sz=$(wc -c < /tmp/verify)
            echo "${f} -> final HTTP ${code} (${sz}B)"
            if [ "${code}" != "200" ] || [ "${sz}" = "0" ]; then
              echo "Missing asset on CNB: ${f}"
              exit 1
            fi
          done
        shell: bash

      - name: Rewrite latest.json URLs to CNB and overwrite GitHub release asset
        env:
          TAG: ${{ needs.build-and-release.outputs.tag_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          GH_BASE="https://github.com/${GH_REPO}/releases/download/${TAG}"
          CNB_BASE="https://cnb.cool/${CNB_REPO_SLUG}/-/releases/download/${TAG}"

          echo "--- original (from tauri-action) ---"
          cat latest.json
          echo ""

          echo "Rewriting GitHub URLs -> CNB URLs..."
          sed -i "s|${GH_BASE}|${CNB_BASE}|g" latest.json
          echo "--- rewritten latest.json ---"
          cat latest.json
          echo ""

          echo "Overwriting GitHub release asset latest.json..."
          /usr/bin/gh release upload "${TAG}" latest.json --repo "${GH_REPO}" --clobber
          echo "Done. GitHub release latest.json now points to CNB."

          echo ""
          echo "Waiting for GitHub CDN to propagate (avoid false FAIL below)..."
          sleep 10

          echo "--- verify by downloading from GitHub ---"
          curl -fSL --retry 3 -o verify.json "https://github.com/${GH_REPO}/releases/download/${TAG}/latest.json"
          grep -q "${CNB_BASE}" verify.json && echo "OK: GitHub latest.json now references CNB" || { echo "FAIL: CNB URL not found in GitHub latest.json"; exit 1; }
        shell: bash
