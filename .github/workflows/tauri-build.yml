name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.0.6)'
        required: true
      signing_key:
        description: 'Tauri signing private key (base64)'
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & publish release
    runs-on: windows-latest
    outputs:
      tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci
        shell: bash

      - name: Resolve version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event.inputs.signing_key || secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: .
          tagName: ${{ github.event.inputs.tag_name || github.ref_name }}
          releaseName: ${{ github.event.inputs.tag_name || github.ref_name }}
          releaseBody: "Task Manager ${{ github.event.inputs.tag_name || github.ref_name }} - Windows x64 installer with auto-update"
          releaseDraft: false
          releasePrerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

  upload-to-cnb:
    name: Upload artifacts to CNB
    runs-on: ubuntu-latest
    needs: build-and-release
    if: ${{ always() && needs.build-and-release.result == 'success' }}
    env:
      CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
      CNB_API_ENDPOINT: https://api.cnb.cool
      CNB_REPO_SLUG: shiyishi-2026/surenwu
    steps:
      - name: Download release assets
        env:
          TAG: ${{ needs.build-and-release.outputs.tag_name }}
          VER: ${{ needs.build-and-release.outputs.version }}
        run: |
          set -euo pipefail
          BASE="https://github.com/a136249692/renwu/releases/download/${TAG}"
          for f in "latest.json" "TaskManager_${VER}_x64-setup.exe" "TaskManager_${VER}_x64-setup.exe.sig"; do
            echo "Downloading ${f}"
            curl -fSL -o "$f" "${BASE}/${f}"
            test -s "$f"
          done
        shell: bash

      - name: Upload to CNB release via official plugin
        env:
          TAG: ${{ needs.build-and-release.outputs.tag_name }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e CNB_TOKEN="${CNB_TOKEN}" \
            -e CNB_API_ENDPOINT="${CNB_API_ENDPOINT}" \
            -e CNB_REPO_SLUG="${CNB_REPO_SLUG}" \
            -e PLUGIN_TAG="${TAG}" \
            -e PLUGIN_ATTACHMENTS='./latest.json,./TaskManager_*.exe,./TaskManager_*.exe.sig' \
            -v "$(pwd):$(pwd)" \
            -w "$(pwd)" \
            cnbcool/attachments:latest
        shell: bash
