name: Release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & publish release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci
        shell: bash

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: *** secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: *** secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: .
          releaseType: GitHub
          updaterJson: true

      - name: List artifacts
        run: |
          find . -name "*.exe" -o -name "*.sig" -o -name "latest.json" | head -50
        shell: bash
