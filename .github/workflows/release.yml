name: Release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Just print signing key diagnostics, skip build"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & publish release
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          echo "=== Signing key diagnostics ==="
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "FAIL: TAURI_SIGNING_PRIVATE_KEY secret is empty or missing."
            exit 1
          fi
          LEN=${#TAURI_SIGNING_PRIVATE_KEY}
          FIRST=$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | head -c 24)
          LAST=$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | tail -c 24)
          echo "Total length: $LEN (expected 348)"
          echo "First 24 chars: $FIRST"
          echo "Last  24 chars: $LAST"
          if ! printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | base64 -d > /tmp/key.bin 2> /tmp/b64err.txt; then
            echo "FAIL: base64 decode error: $(cat /tmp/b64err.txt)"
            python3 <<'PYEOF'
import os, re
k = os.environ['TAURI_SIGNING_PRIVATE_KEY']
for i, c in enumerate(k):
    if not re.match(r'^[A-Za-z0-9+/=]$', c):
        print(f"First invalid char at offset {i}: {c!r} (ord={ord(c)})")
        print(f"Context around it: ...{k[max(0,i-20):i]}<HERE>{k[i+1:i+21]}...")
        break
else:
    print("All chars look like valid base64 alphabet; length may be wrong.")
PYEOF
            exit 1
          fi
          DECODED=$(wc -c < /tmp/key.bin)
          echo "Decoded size: $DECODED bytes (expected 259)"
          if ! head -c 60 /tmp/key.bin | grep -q "untrusted comment: rsign"; then
            echo "FAIL: Decoded key does not look like a minisign signing key."
            exit 1
          fi
          echo "OK: Signing key looks valid."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci
        shell: bash

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          includeUpdaterJson: true
